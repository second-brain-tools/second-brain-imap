[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "second-brain-imap"
dynamic = ["version"]
description = "MCP server that lets Claude search and read an IMAP mailbox, read-only. Built for Proton Mail Bridge."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "imap", "email", "proton-mail-bridge", "second-brain", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: Email",
]
dependencies = [
    "fastmcp>=4.1,<5",
    # 4.3 has `literal`, which search terms are sent as, and checks every wire argument.
    "imapclient>=4.3",
    "pydantic>=2",
    "python-dotenv>=1.0",
    # Sign-in, the audit log and HTTP serving, shared with the other Second Brain
    # servers. 0.x: a new minor version may change its interfaces.
    "second-brain-core>=0.1.1,<0.2",
]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # tests/wire.py makes throwaway certificates for a TLS server inside the test process.
    "cryptography",
]

[project.urls]
Homepage = "https://github.com/second-brain-tools/second-brain-imap"
Repository = "https://github.com/second-brain-tools/second-brain-imap"
Changelog = "https://github.com/second-brain-tools/second-brain-imap/blob/main/CHANGELOG.md"
Issues = "https://github.com/second-brain-tools/second-brain-imap/issues"

[project.scripts]
second-brain-imap = "second_brain_imap.cli:main"

[tool.hatch.version]
path = "src/second_brain_imap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain_imap"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The 90% coverage gate is enforced in CI via `--cov-fail-under=90` (see
# .github/workflows/checks.yml). It is intentionally NOT in addopts so that
# running a subset of tests locally (e.g. `pytest tests/test_cli.py`) does not
# spuriously fail the gate. Run `uv run pytest --cov-fail-under=90` to reproduce.
addopts = "--cov=second_brain_imap --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["second_brain_imap"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
ignore_missing_imports = true
